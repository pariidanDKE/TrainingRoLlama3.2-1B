task: base_laroseda
dataset_path: parquet
dataset_name: null
dataset_kwargs:  # parquet export on the Hub (the original loading script no longer runs)
  data_files:
    train: hf://datasets/universityofbucharest/laroseda@refs%2Fconvert%2Fparquet/laroseda/train/0000.parquet
    test: hf://datasets/universityofbucharest/laroseda@refs%2Fconvert%2Fparquet/laroseda/test/0000.parquet

training_split: train
test_split: test
fewshot_split: train

output_type: multiple_choice
process_docs: !function utils.process_docs

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

  - metric: macro_f1
    aggregation: macro_f1
    higher_is_better: true
    
  - metric: weighted_f1
    aggregation: weighted_f1
    higher_is_better: true
metadata:
  version: 1.0
